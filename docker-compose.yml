services:
  # ==========================================
  # 1. BASE DE DATOS (POSTGRESQL 15)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: overlay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eddam_postgres_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-eddam_overlay_studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eddam_overlay_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - overlay_network

  # ==========================================
  # 2. BACKEND API & WEBSOCKETS (FASTIFY)
  # ==========================================
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: overlay_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-eddam_postgres_secret_2026}@db:5432/${POSTGRES_DB:-eddam_overlay_studio}
      - JWT_SECRET=${JWT_SECRET:-eddam-super-secret-overlay-studio-key-2026}
      - PORT=3000
      - HOST=0.0.0.0
      # Recuperación de contraseña por correo (Resend o SMTP)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - overlay_network

  # ==========================================
  # 3. FRONTEND (VITE + NGINX REVERSE PROXY)
  # ==========================================
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: overlay_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - overlay_network

volumes:
  pgdata:
    driver: local

networks:
  overlay_network:
    driver: bridge

databases:
  - name: eddam-db
    databaseName: eddam_db
    user: eddam_user
    plan: free

services:
  # 1. Backend API (WebSockets & Base de Datos)
  - type: web
    name: eddam-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter api run build
    startCommand: cd apps/api && pnpm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eddam-db
          property: connectionString
          
  # 2. Frontend (Panel de Control & Overlays)
  - type: web
    name: eddam-studio
    env: static
    buildCommand: pnpm install && pnpm --filter web run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://eddam-api.onrender.com # Render asignará este dominio automáticamente al servicio api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
